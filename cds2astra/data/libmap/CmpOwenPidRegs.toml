# CmpOwenPidRegs (ОВЕН) -> AstraCompat. Компонент рантайма ОВЕН с внешними функциями: в CODESYS Control Win
# он в лучшем случае скомпилируется, но не запустится; на REGUL его нет.

[library]
name = "CmpOwenPidRegs"
namespace = "OPR"
replacement = "AstraCompat"
source_url = "https://ftp.owen.ru/CoDeSys3/11_Documentation/03_3.5.11.5/CDSv3.5_CmpOwenPidRegs_v2.2.pdf"

[[pou]]
source = "STD_PID"
kind = "wrap"
target = "FB_C2aPid"
