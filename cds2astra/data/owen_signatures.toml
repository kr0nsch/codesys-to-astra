[[pou]]
library = "OwenStringUtils"
name = "REAL_TO_STRING_FORMAT"
kind = "function"
doc = "osu"
page = 9
pins = [
  ["rValueToConvert", "REAL", "in"],
  ["usiSignificantDigitsCount", "USINT", "in"],
  ["eDecimalSeparator", "DECIMAL_SEPARATOR", "in"],
  ["REAL_TO_STRING_FORMAT", "STRING(80)", "ret"],
]
note = "DECIMAL_SEPARATOR: DOT = 0, COMMA = 1 (USINT), табл. 3.2.2; недопустимый разделитель -> точка; > 1e8 -> экспоненциальная запись"

[[pou]]
library = "OwenStringUtils"
name = "Before"
kind = "function"
doc = "osu"
page = 15
pins = [["sSource", "STRING(255)", "in"], ["sPostfix", "STRING(255)", "in"], ["Before", "STRING(255)", "ret"]]
note = "подстрока до первого вхождения sPostfix; не найдена -> пустая строка"

[[pou]]
