# Сигнатуры POU библиотек ОВЕН — только из документации ОВЕН (страница, версия документа, SHA-256 PDF).
# Нет источника — нет строки. PDF в репозиторий не кладутся (ссылки — docs/SOURCES.md).
# Порядок входов — как в таблице документа. pins: имя, тип, направление (in/out/ret).

