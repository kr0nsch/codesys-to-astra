# --- узлы таргета (C2A-IO002) ---------------------------------------------------------------

[nodes.OwenRTC]
doc = "targets"
page = 10
replacement = "FB_C2aRtc"
kind = "wrap"
channels = [
  ["Year", "UINT", "ro"], ["Month", "USINT", "ro"], ["Day", "USINT", "ro"], ["Hour", "USINT", "ro"],
  ["Minute", "USINT", "ro"], ["Second", "USINT", "ro"], ["Day of week", "USINT", "ro"],
  ["Week of year", "USINT", "ro"], ["Format date", "STRING(80)", "ro"], ["Format time", "STRING(80)", "ro"],
  ["UTC Offset", "SINT", "ro"], ["Date And Time", "DT", "ro"], ["System timer", "LTIME", "ro"],
  ["Operating Time", "LTIME", "ro"],
]
# каналы FB_C2aRtc с тем же смыслом (неизвестные каналы -> todo)
outputs = { "Year" = "uiYear", "Month" = "usiMonth", "Day" = "usiDay", "Hour" = "usiHour", "Minute" = "usiMinute", "Second" = "usiSecond", "Day of week" = "usiDayOfWeek", "Format date" = "sFormatDate", "Format time" = "sFormatTime", "Date And Time" = "dtDateAndTime", "System timer" = "ltSystemTimer" }

