# --- модули Mx210 (C2A-IO003) ----------------------------------------------------------------

[modules."MV210-101"]
doc = "mv210_101"
title = "МВ210-101, модуль аналогового ввода (8 AI), Modbus TCP"
max_clients = 4
max_clients_page = 23
read_fc = [3, 4]
write_fc = [16]
# канал: имя шаблона ОВЕН, регистр, число регистров, тип, страница
[[modules."MV210-101".registers]]
name = "Вход {n}/Измеренное значение"
first = 4000
step = 3
count = 8
words = 2
type = "REAL"
page = 28
[[modules."MV210-101".registers]]
name = "Вход {n}/Циклическое время измерения"
first = 4002
step = 3
count = 8
words = 1
type = "UINT"
page = 28
[[modules."MV210-101".registers]]
name = "Вход {n}/Значение (integer)"
first = 4064
step = 1
count = 8
words = 1
type = "INT"
page = 28

[modules."MV210-101".status_codes]
page = 36
# Таблица 6.9: код ошибки датчика передаётся в регистре значения (положение байта в FLOAT32 — сверить)
codes = [
  [0xF0, "заведомо неверно"], [0xF6, "данные не готовы"], [0xF7, "датчик отключён"],
  [0xF8, "велика температура свободных концов ТП"], [0xF9, "мала температура свободных концов ТП"],
  [0xFA, "значение слишком велико"], [0xFB, "значение слишком мало"], [0xFC, "короткое замыкание"],
  [0xFD, "обрыв датчика"], [0xFE, "нет связи с АЦП"], [0xFF, "некорректный калибровочный коэффициент"],
]

