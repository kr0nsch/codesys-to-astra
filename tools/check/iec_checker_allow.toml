# Обоснованные находки iec_checker (tools/check/run_iec_checker.py).
# Обоснованная находка попадает в отчёт со статусом allowed и не роняет проверку.
# Подробный разбор — docs/STATIC_ANALYSIS.md; при изменении кода держите их согласованными.
#
# Ключи записи [[allow]]: id (шаблон fnmatch правила), file (шаблон пути исходника; '*' захватывает и '/'),
# match (необязательно: регулярное выражение по тексту сообщения), reason (обязательно).
# ParserError и LexingError обосновать нельзя: их исправляют в коде или в понижении iec-checker.
#
# Проект cds2astra (AstraCompat): python tools/check/run_iec_checker.py --tests — ParserError 0, необоснованных 0;
# каждая запись используется (pytest: test_run_iec_checker.py::test_integration_repository_sources).

[[allow]]
id = "PLCOPEN-CP3"
file = "src/*"
reason = "Переменная без явного начального значения получает значение по умолчанию своего типа (МЭК 61131-3, как в CODESYS); вариант сборки iec-checker убирает неконстантные начальные значения"

[[allow]]
id = "PLCOPEN-CP3"
file = "tests/*"
reason = "Как для src/: значения по умолчанию типов; результаты тестов присваиваются до чтения"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/FB_C2aPid/*"
match = "PV_TIME|XN|VSP|INF"
reason = "Пины интерфейса STD_PID CmpOwenPidRegs сохранены для замены wrap (те же имена и типы); поведение XN, VSP, INF, PV_TIME не повторяется — так и сказано в заголовке FB_C2aPid и в таблице замен (исход check)"

